<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>힘의 섬 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: 바다 위 다섯 섬 지도(홈) → 섬마다 개념·실험실·미션 카드가 세로로 이어지는 탐험 화면. 위쪽에 N코인과 배지 막대. 교실 화면용 단일 밝은 테마. */
:root{
  --sea:#DDF1F7;
  --sea-deep:#BFE3EE;
  --paper:#FFFDF8;
  --ink:#1F2433;
  --muted:#5E6577;
  --line:#E3E0D8;
  --brand:#14998A;       /* 뉴티 민트 */
  --brand-soft:#D7F2EE;
  --coin:#F2B632;
  --ok:#2E9E5B;
  --bad:#D9443B;
  --c1:#EE3F8C; --c2:#7A5AF0; --c3:#2E9E5B; --c4:#F07D1A; --c5:#1F7FD6;
  --title:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --font:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Gaegu","Gowun Dodum",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 48px}
/* 상단 막대 */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:8px 14px;box-shadow:0 6px 18px rgb(20 60 80/.08)}
.hud .logo{font-family:var(--title);font-size:20px;display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0}
.hud .logo svg{width:30px;height:30px}
.hud .sp{flex:1}
.coins{font-family:var(--title);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--coin);color:#6A4A00;font-size:13px;box-shadow:inset 0 -2px 0 rgb(0 0 0/.15)}
.badges{display:flex;gap:4px}
.badges span{width:24px;height:24px;border-radius:50%;border:2px dashed #C9CDD6;display:grid;place-items:center;font-family:var(--title);font-size:12px;color:#B4B9C4}
.badges span.got{border-style:solid;color:#fff}
.tbtn{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;min-height:32px}
.tbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,.isle:focus-visible{outline:3px solid var(--c5);outline-offset:2px}
/* 지도 */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:center;margin:22px 0 10px}
.intro h1{font-family:var(--title);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.intro h1 b{font-weight:400;color:var(--brand)}
.say{position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px 16px;font-size:17px;max-width:62ch}
.say::after{content:"";position:absolute;right:-12px;top:30px;border:10px solid transparent;border-left-color:var(--ink)}
.say b{font-weight:400;color:var(--brand)}
.mascot svg{width:100%;height:auto;display:block}
.map{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--sea-deep),var(--sea));border:2px solid #A8D6E3}
.map svg.sea{display:block;width:100%;height:auto}
.isles{position:absolute;inset:0}
.isle{position:absolute;transform:translate(-50%,-50%);width:17%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.isle .blob{width:100%;aspect-ratio:1.25;border-radius:48% 52% 44% 56%/56% 44% 56% 44%;display:grid;place-items:center;box-shadow:0 8px 0 rgb(0 0 0/.08);transition:transform .2s}
.isle:hover .blob{transform:translateY(-4px)}
.isle .blob span{font-family:var(--title);font-size:clamp(20px,3.6vw,38px);color:#fff;text-shadow:0 2px 0 rgb(0 0 0/.15)}
.isle .nm{margin-top:6px;font-family:var(--title);font-size:clamp(13px,1.8vw,18px);background:#fff;border-radius:99px;padding:2px 12px;white-space:nowrap;box-shadow:0 2px 0 rgb(0 0 0/.08)}
.isle.lock .blob{filter:grayscale(1) opacity(.45)}
.isle.lock .nm::before{content:"🔒 "}
.isle.done .nm::after{content:" ✓";color:var(--ok)}
.isle.final{width:19%}
.legend2{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted);margin-top:10px}
/* 섬 화면 */
.stagehead{display:flex;align-items:center;gap:14px;margin:22px 0 14px}
.stagehead .no{font-family:var(--title);color:#fff;border-radius:16px;padding:6px 14px;font-size:20px}
.stagehead h2{font-family:var(--title);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;line-height:1.15;text-wrap:balance}
.stagehead .back{margin-left:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.card h3{font-family:var(--title);font-weight:400;font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:13px;font-family:var(--font);background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 10px}
.guide{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:14px}
.guide svg{width:72px;height:72px}
.guide .say{font-size:16px}
.guide .say::after{left:-12px;right:auto;border-left-color:transparent;border-right-color:var(--ink);top:20px}
.concept{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.concept li{padding-left:1.2em;text-indent:-1.2em}
.concept li::before{content:"✦ ";color:var(--brand)}
.b{display:inline-block;min-width:3.4em;text-align:center;border:0;border-bottom:2px solid var(--ink);background:#F5F2EA;color:transparent;cursor:pointer;padding:0 .4em;margin:0 .1em;border-radius:4px 4px 0 0;line-height:1.35;text-indent:0;transition:color .2s,background .2s}
.b:hover{background:#FFE9A8}
.b.shown{color:var(--bad);background:transparent;border-bottom-color:var(--bad)}
.b:focus-visible{outline:2px solid var(--c5)}
.hint{font-family:var(--hand);color:var(--c5);font-size:19px;line-height:1.3}
.lab{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.view{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.view svg{display:block;width:100%;height:auto}
.ctrls{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row label{display:flex;align-items:center;gap:8px;flex:1 1 220px}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--brand)}
.val{font-family:var(--title);font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;min-height:38px}
.seg button+button{border-left:1px solid #D7D3CB}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 14px;cursor:pointer;min-height:40px;font-family:var(--title);font-size:17px}
.btn:hover{background:#FFF3C9}
.btn.main{background:var(--ink);color:#fff}
.btn.main:hover{background:#3A4157}
.btn:disabled{opacity:.4;cursor:not-allowed}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.readout div{background:#F7F5EF;border-radius:10px;padding:8px 10px}
.readout small{display:block;color:var(--muted);font-size:13px}
.readout b{font-family:var(--title);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:flex;gap:8px;align-items:flex-start;font-size:16px}
.tasks li::before{content:"";flex:none;width:20px;height:20px;margin-top:3px;border-radius:6px;border:2px solid #B9BDC8;background:#fff}
.tasks li.ok::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px #fff}
.tasks li.ok{color:var(--ok)}
table.rec{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums;background:#fff}
table.rec th,table.rec td{border:1px solid #D9D5CC;padding:5px 8px;text-align:center}
table.rec th{background:#F3F0E8;font-weight:400}
.tblwrap{overflow-x:auto}
/* 퀴즈 */
.quiz{display:grid;gap:14px}
.qitem{border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.qitem.right{border-color:var(--ok)}
.qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.qhead .n{font-family:var(--title);color:#fff;background:var(--ink);border-radius:8px;padding:0 8px;flex:none}
.qhead p{margin:0;font-size:17px}
.qfig{max-width:360px;margin:4px 0 10px}
.qfig svg{width:100%;height:auto;display:block}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.opt{text-align:left;border:1.5px solid #CFCBC2;background:#FBFAF6;border-radius:10px;padding:8px 12px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--ink)}
.opt.right{background:#E3F5EA;border-color:var(--ok);color:#17663A}
.opt.wrong{background:#FCE8E6;border-color:var(--bad);color:#8F2620;text-decoration:line-through}
.fb{margin-top:8px;font-size:15px;display:none}
.fb.on{display:block}
.fb .t{font-family:var(--title)}
.fb.good .t{color:var(--ok)}
.fb.bad .t{color:var(--bad)}
.done-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brand-soft);border-radius:14px;padding:12px 16px}
.done-bar p{margin:0;flex:1 1 260px}
/* 배지 획득 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-family:var(--title);font-size:18px;z-index:20;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast{visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
.hidden-n{position:absolute;width:30px;height:33px;border:0;background:none;padding:0;cursor:pointer;opacity:.55;transform:rotate(-14deg);z-index:2}
.hidden-n:hover{opacity:1;transform:rotate(0) scale(1.15)}
.hidden-n svg{width:100%;height:100%}
.factpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px 22px;max-width:min(420px,calc(100% - 32px));box-shadow:0 20px 60px rgb(0 0 0/.25);text-align:center}
.factpop b{font-family:var(--title);font-weight:400;font-size:22px;color:var(--brand)}
.factpop p{margin:10px 0 14px}
.bonusrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.bonus{display:flex;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:12px 16px;text-align:left;cursor:pointer}
.bonus:disabled{opacity:.5;cursor:not-allowed}
.bonus .ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--title);font-size:22px}
.bonus b{font-family:var(--title);font-weight:400;font-size:19px;display:block}
.bonus small{color:var(--muted)}
.sp-ready{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0}
.sp-top{display:flex;align-items:center;gap:12px}
.sp-time{flex:1;height:12px;background:#EEEAE0;border-radius:99px;overflow:hidden}
.sp-time i{display:block;height:100%;width:100%;background:var(--coin);transition:width 1s linear}
.sp-card{margin:18px 0 6px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:28px 20px;text-align:center;font-family:var(--title);font-size:clamp(22px,3.4vw,32px);line-height:1.35;min-height:6.2em;display:grid;place-items:center;text-wrap:balance}
.sp-combo{text-align:center;font-family:var(--title);font-size:20px;min-height:1.4em;margin:0 0 10px}
.sp-combo.good{color:var(--ok)}.sp-combo.bad{color:var(--bad)}
.sp-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sp-btns .btn{font-size:clamp(18px,2.6vw,24px);padding:14px 6px;border-width:3px}
@media (max-width:760px){.sp-btns{grid-template-columns:1fr 1fr}}
.ending{background:var(--paper)}
.scene{display:block;width:100%;height:auto;border-radius:16px;border:2px solid var(--ink)}
.scene .beam{opacity:0;transition:opacity 1s}
.scene.lit .beam{opacity:1}
.scene.lit .lamp{fill:#FFE38A}
.scene .gem{opacity:.25;transition:opacity .6s}
.scene.lit .gem{opacity:1}
.scene .flame{opacity:0;transform-origin:40px 34px;transition:opacity .4s}
.scene.fuel .flame{opacity:1;animation:flick .15s infinite alternate}
@keyframes flick{to{transform:scaleY(1.3)}}
.scene .shipin{transition:transform 2.4s cubic-bezier(.5,0,.3,1)}
.scene.fly .shipin{transform:translate(70px,-150px) rotate(14deg)}
/* 수료증 */
.cert{position:relative;background:#FFFCF0;border:3px solid var(--ink);border-radius:22px;padding:28px clamp(16px,4vw,44px);text-align:center;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:2px dashed #D9C47A;border-radius:14px;pointer-events:none}
.cert h2{font-family:var(--title);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0}
.cert .who{font-family:var(--title);font-size:clamp(26px,4vw,36px);color:var(--brand);border-bottom:2px solid var(--ink);display:inline-block;min-width:8em;padding:0 10px;margin:14px 0}
.cert .bdg{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.cert .bdg span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--title);font-size:13px;line-height:1.1;box-shadow:inset 0 -4px 0 rgb(0 0 0/.15)}
.cert p{margin:6px 0}
.namein{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.namein input{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;min-width:0;width:14em;max-width:100%}
.foot{color:var(--muted);font-size:13px;margin-top:20px;text-align:center}
@media (max-width:760px){
  body{font-size:16px}
  .intro{grid-template-columns:1fr}
  .intro .mascot{order:-1;width:140px;justify-self:center}
  .say::after{display:none}
  .lab{grid-template-columns:1fr}
  .map svg.sea{display:none}
  .isles{position:static;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
  .isle,.isle.final{position:static;transform:none;width:auto;aspect-ratio:auto}
  .isle.final{grid-column:1/-1}
  .isle .blob{width:70%}
  .isle.final .blob{width:40%}
  .badges{order:3;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 뉴티: 꼭지가 힘의 화살표, 광택이 N 모양인 사과 머리에 용수철 몸통 -->
    <symbol id="newty" viewBox="0 0 200 220">
      <ellipse cx="100" cy="208" rx="40" ry="8" fill="#1F7FD6" stroke="#1F2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-width="4"/>
      <path d="M100 202 q-30 -4 0 -10 q30 -4 0 -10 q-30 -4 0 -10 q30 -4 0 -10 q-30 -4 0 -10" fill="none" stroke="#5E6577" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(100 96) scale(.78) translate(-100 -116)">
        <path d="M100 64 C 72 42, 22 50, 22 112 C 22 164, 62 196, 100 182 C 138 196, 178 164, 178 112 C 178 50, 128 42, 100 64 Z" fill="#E8463D" stroke="#1F2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M43 124 Q33 102 45 78 Q54 98 61 116 Q52 94 66 72" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
        <path d="M100 64 C 100 50, 102 38, 104 26" fill="none" stroke="#6B4423" stroke-width="6" stroke-linecap="round"/>
        <path d="M106 6 l-15 19 h26z" fill="#EE3F8C" stroke="#1F2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-width="4"/>
        <path d="M106 46 C 118 28, 146 28, 152 38 C 140 52, 118 54, 106 46 Z" fill="#5BBF5A" stroke="#1F2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-width="4"/>
        <circle cx="80" cy="110" r="9" fill="#1F2433"/><circle cx="128" cy="110" r="9" fill="#1F2433"/>
        <circle cx="83" cy="107" r="3" fill="#fff"/><circle cx="131" cy="107" r="3" fill="#fff"/>
        <path d="M95 124 q9 14 18 0 z" fill="#C2352D" stroke="#1F2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-width="3.5"/>
        <ellipse cx="66" cy="128" rx="9" ry="5" fill="#FF9FBF" opacity=".9"/><ellipse cx="144" cy="128" rx="9" ry="5" fill="#FF9FBF" opacity=".9"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="hud">
    <button class="logo" id="home" aria-label="지도로 돌아가기"><svg viewBox="0 0 200 220" aria-hidden="true"><use href="#newty"/></svg>힘의 섬 탐험대</button>
    <span class="sp"></span>
    <div class="badges" id="badgeBar" aria-label="모은 배지"></div>
    <div class="coins" aria-label="N코인"><span class="coin">N</span><span id="coinN">0</span></div>
    <button class="tbtn" id="teacher" aria-pressed="false" hidden>선생님 모드 끄기</button>
  </header>
  <main id="app"></main>
  <p class="foot">수빈t와 함께하는 과학시간 · 중1 Ⅴ. 힘의 작용 1. 여러 가지 힘 복습 · 진행 기록은 이 기기의 브라우저에만 저장돼요.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function tx(p,x,y,s,a={}){const t=el("text",Object.assign({x,y,"font-family":"Jua, Gowun Dodum, sans-serif","font-size":18,fill:"#1F2433"},a),p);t.textContent=s;return t}
function arrowH(p,x1,y,x2,color,w=7){if(Math.abs(x2-x1)<2)return;const d=Math.sign(x2-x1);el("line",{x1,y1:y,x2:x2-d*14,y2:y,stroke:color,"stroke-width":w,"stroke-linecap":"round"},p);el("path",{d:`M${x2} ${y} l${-d*20} -11 v22z`,fill:color},p)}
function arrowV(p,x,y1,y2,color,w=7){if(Math.abs(y2-y1)<2)return;const d=Math.sign(y2-y1);el("line",{x1:x,y1,x2:x,y2:y2-d*14,stroke:color,"stroke-width":w,"stroke-linecap":"round"},p);el("path",{d:`M${x} ${y2} l-11 ${-d*20} h22z`,fill:color},p)}
const COL=["#EE3F8C","#7A5AF0","#2E9E5B","#F07D1A","#1F7FD6"];

/* ---------- 상태 ---------- */
const KEY="force-isles-v1";
let S={coins:0,badges:[false,false,false,false,false],final:false,name:"",teacher:false,quiz:{},tasks:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2400)}
function hud(){$("#coinN").textContent=S.coins;
  $("#badgeBar").innerHTML=ISLES.map((s,i)=>`<span class="${S.badges[i]?"got":""}" style="${S.badges[i]?`background:${COL[i]};border-color:${COL[i]}`:""}" title="${s.name}">${i+1}</span>`).join("");
  $("#teacher").classList.toggle("on",S.teacher);$("#teacher").setAttribute("aria-pressed",S.teacher);$("#teacher").hidden=!S.teacher}
function unlocked(i){return S.teacher||i===0||S.badges[i-1]}
function finalOpen(){return S.teacher||S.badges.every(Boolean)}

function bindBlanks(r){$$(".b",r).forEach(b=>{b.setAttribute("aria-label","빈칸, 눌러서 정답 보기");b.onclick=()=>b.classList.toggle("shown")})}
function taskList(box,id,items){

  const draw=()=>{ul.innerHTML=items.map(([k,t])=>`<li class="${S.tasks[id][k]?"ok":""}">${t}</li>`).join("")};
  draw();box.appendChild(ul);
  return {done(k){if(!S.tasks[id][k]){S.tasks[id][k]=true;save();draw();toast("미션 완료! +5 N코인");S.coins+=5;save();hud();checkDone(CUR)}},
          all(){return items.every(([k])=>S.tasks[id][k])}};
}
let CUR=0;
function checkDone(i){
  CUR=i;const box=$("#doneBox");if(!box)return;

    $("#buHint").textContent=subN===0?"아직 물 밖! 이때 센서 값 3.9 N이 추의 무게예요.":subN<4?"잠긴 부피가 커질수록 센서 값이 줄고 부력이 커져요.":"모두 잠겼어요. 더 내려도 잠긴 부피가 같아서 부력도 같아요.";
    if(Math.abs(subN-2)<.08)t1.done("two");if(subN>=4){t1.done("four");if(d>=.95)t1.done("deep")}};
  $("#buD").oninput=draw1;draw1();

  /* --- 실험 2: 뜰까, 가라앉을까 --- */
  const t2=taskList($("#flTasks",box),"float",[["A","<b>물에 떠서</b> 정지한 부품 보기 (부력 = 중력, 일부만 잠김)"],["B","<b>물속에서</b> 정지한 부품 보기 (부력 = 중력, 완전히 잠김)"],["C","<b>바닥에 가라앉은</b> 부품 보기 (부력 < 중력, 바닥이 받쳐 줌)"],["P","부품 6개의 결과를 모두 <b>예측해서 맞히기</b>"]]);
  const PARTS=[["연료통",7],["강철 볼트 상자",16],["엔진 덮개",10],["스프링 부품",4],["배터리",13],["안테나 통",10]];
  const ANS=w=>w<10?"float":w===10?"mid":"sink";
  const LBL={float:"물 위에 떠서 멈춤",mid:"물속에서 멈춤",sink:"바닥까지 가라앉음"};
  const solved=new Set(S.tasks.floatSolved||[]);
  const SURF=110,BOT=360,SZ=70,BMAX=10,TX=170;
  const st={W:6,y:SURF+40,v:0,raf:0,pred:null,card:null,done:false};
  const forces=()=>{const f=Math.max(0,Math.min(1,(st.y+SZ-SURF)/SZ));const B=BMAX*f;const onBot=st.y+SZ>=BOT-0.5;const N=onBot?Math.max(0,st.W-B):0;return {f,B,N,onBot}};
  const drawF=()=>{const s=$("#flSvg");if(!s){cancelAnimationFrame(st.raf);return}s.innerHTML="";
    el("rect",{x:0,y:0,width:640,height:400,fill:"#EAF6FB"},s);
    el("rect",{x:40,y:SURF,width:360,height:BOT-SURF,fill:"#7FC4E6",opacity:.75},s);
    el("path",{d:`M40 40 V${BOT+4} H400 V40`,fill:"none",stroke:"#1F2433","stroke-width":4},s);
    el("rect",{x:40,y:BOT,width:360,height:4,fill:"#1F2433"},s);
    tx(s,410,SURF+5,"수면",{"font-size":14,fill:"#1F7FD6"});tx(s,410,BOT,"바닥",{"font-size":14});
    const {f,B,N,onBot}=forces();const x=TX,y=st.y;
    el("rect",{x,y,width:SZ,height:SZ,rx:10,fill:st.W<10?"#F2B632":st.W===10?"#5FD3C3":"#8A8FA0",stroke:"#1F2433","stroke-width":3},s);
    tx(s,x+SZ/2,y+SZ/2+7,st.W+" N",{"text-anchor":"middle","font-size":18});
    const K=3.6,cx=x+SZ/2,cy=y+SZ/2;
    arrowV(s,cx-14,cy,cy+st.W*K+8,"#7A5AF0",5);tx(s,cx-96,Math.min(392,cy+st.W*K+6),"중력 "+st.W+" N",{"font-size":14,fill:"#7A5AF0"});
    if(B>0.05){arrowV(s,cx+14,cy,cy-B*K-8,"#1F7FD6",5);tx(s,cx+22,Math.max(16,cy-B*K-4),"부력 "+B.toFixed(1)+" N",{"font-size":14,fill:"#1F7FD6"})}
    if(N>0.05){arrowV(s,x+SZ+14,BOT,BOT-N*K-10,"#2E9E5B",5);tx(s,x+SZ+22,BOT-N*K-12,"바닥이 받치는 힘 "+N.toFixed(1)+" N",{"font-size":13,fill:"#2E9E5B"})}
    $("#flG").textContent=st.W+" N";$("#flB").textContent=B.toFixed(1)+" N";$("#flN").textContent=N.toFixed(1)+" N";
    const net=st.W-B-N;let msg;
    if(!st.done)msg=net>0.05?"⬇ 가라앉는 중 (중력 > 부력)":net<-0.05?"⬆ 떠오르는 중 (부력 > 중력)":"움직이는 중…";
    else msg=onBot&&N>0.05?"바닥에 닿아 정지: 부력 < 중력, 바닥이 나머지를 받쳐요":f<0.999?"물에 떠서 정지: 부력 = 중력 (일부만 잠김)":"물속에서 정지: 부력 = 중력 (완전히 잠김)";
    $("#flState").textContent=msg;$("#flWv").textContent=st.W+" N";
    // 오른쪽 설명 막대
    el("rect",{x:450,y:60,width:160,height:300,rx:12,fill:"#fff",stroke:"#E3E0D8"},s);
    tx(s,530,90,"힘 비교",{"text-anchor":"middle","font-size":16});
    const bar=(xx,val,c,lab)=>{const h=val*12;el("rect",{x:xx,y:330-h,width:34,height:h,rx:4,fill:c},s);tx(s,xx+17,350,lab,{"text-anchor":"middle","font-size":13})};
    bar(470,st.W,"#7A5AF0","중력");bar(513,B,"#1F7FD6","부력");bar(556,N,"#2E9E5B","바닥");
    el("line",{x1:462,y1:330-BMAX*12,x2:600,y2:330-BMAX*12,stroke:"#1F7FD6","stroke-dasharray":"4 4"},s);tx(s,600,330-BMAX*12-6,"부력 최대 10 N",{"text-anchor":"end","font-size":12,fill:"#1F7FD6"});
  };
  const settle=()=>{if(st.W<BMAX&&st.y+SZ<BOT-1){st.y=SURF-SZ+SZ*st.W/BMAX;st.v=0;drawF()}const {f,onBot,N}=forces();
    if(onBot&&N>0.05)t2.done("C");else if(f<0.999)t2.done("A");else t2.done("B");
    if(st.card!=null&&st.pred){const w=PARTS[st.card][1],a=ANS(w);const ok=st.pred===a;
      const why=a==="float"?`중력 ${w} N < 부력 최대 10 N → 떠올라서, 부력이 ${w} N이 될 만큼만 잠긴 채 멈춰요.`:a==="mid"?`중력 ${w} N = 부력 10 N → 완전히 잠긴 채 물속에서 멈춰요.`:`중력 ${w} N > 부력 최대 10 N → 바닥까지 가라앉고, 바닥이 ${w-10} N을 받쳐 줘요.`;
      $("#flMsg").innerHTML=(ok?"<b style='color:var(--ok);font-weight:400;font-family:var(--title)'>예측 성공!</b> ":"<b style='color:var(--bad);font-weight:400;font-family:var(--title)'>아쉬워요!</b> ")+why;
      if(ok&&!solved.has(st.card)){solved.add(st.card);S.tasks.floatSolved=[...solved];S.coins+=5;save();hud();cards()}
      if(solved.size===PARTS.length)t2.done("P");st.pred=null}};
  const run=y0=>{cancelAnimationFrame(st.raf);st.y=y0;st.v=0;st.done=false;let last=performance.now(),still=0;
    const step=now=>{const dt=Math.min(.04,(now-last)/1000);last=now;
      for(let k=0;k<4;k++){const h=dt/4;const {B,onBot}=forces();let net=st.W-B;const inW=st.y+SZ>SURF;const a=net/st.W*420-(inW?3.2:0.2)*st.v;
        st.v+=a*h;st.y+=st.v*h;if(st.y+SZ>BOT){st.y=BOT-SZ;if(st.v>0)st.v=0}}
      const {B,N}=forces();const net=st.W-B-N;
      if(Math.abs(st.v)<3&&Math.abs(net)<0.15)still+=dt;else still=0;
      if(still>.35){st.done=true;drawF();settle();return}
      drawF();st.raf=requestAnimationFrame(step)};
    if(reduce){for(let k=0;k<4000;k++){const {B}=forces();const a=(st.W-B)/st.W*420-3.2*st.v;st.v+=a*.005;st.y+=st.v*.005;if(st.y+SZ>BOT){st.y=BOT-SZ;st.v=0}}st.done=true;drawF();settle();return}
    st.raf=requestAnimationFrame(step)};
  const cards=()=>{$("#flCards").innerHTML=PARTS.map((p,k)=>`<button class="btn" data-c="${k}" style="font-size:15px;${st.card===k?"background:var(--ink);color:#fff":""}">${solved.has(k)?"✓ ":""}${p[0]} · ${p[1]} N</button>`).join("");
    $$("#flCards [data-c]").forEach(b=>b.onclick=()=>{st.card=+b.dataset.c;st.W=PARTS[st.card][1];$("#flW").value=st.W;cancelAnimationFrame(st.raf);st.y=SURF-SZ-6;st.v=0;st.done=true;drawF();$("#flState").textContent="";cards();
      $("#flMsg").textContent=`${PARTS[st.card][0]}(중력 ${st.W} N)을 물속 가운데에 놓으면 어떻게 될까?`;
      $("#flAsk").innerHTML=Object.entries(LBL).map(([k,v])=>`<button class="btn main" data-p="${k}" style="font-size:15px">${v}</button>`).join("");
      $$("#flAsk [data-p]").forEach(q=>q.onclick=()=>{st.pred=q.dataset.p;$("#flAsk").innerHTML="";$("#flMsg").textContent="관찰 중…";run(SURF+90)})})};
  $("#flW").oninput=e=>{st.W=+e.target.value;st.card=null;cards();$("#flAsk").innerHTML="";drawF()};
  $("#flTop").onclick=()=>{st.card=null;st.pred=null;cards();run(SURF-SZ-20)};
  $("#flMid").onclick=()=>{st.card=null;st.pred=null;cards();run(SURF+90)};
  cards();st.y=SURF-SZ-6;st.done=true;drawF();$("#flState").textContent="";
  if(solved.size===PARTS.length)t2.done("P");
  return {tasks:{all:()=>t1.all()&&t2.all()},stop:()=>cancelAnimationFrame(st.raf)};
};

   <div class="row" style="justify-content:center"><button class="btn main" id="spGo">다시 도전</button>${S.final?`<button class="btn" id="spCert">🎁 등대로 가서 대원증 받기</button>`:""}</div></div>`;

  const app=$("#app");
  app.innerHTML=`<div class="stagehead"><span class="no" style="background:#1F2433">★</span><h2>힘의 등대 · 종합 시험</h2><button class="btn back" id="back">← 지도</button></div>
  <section class="card"><div class="guide"><svg viewBox="0 0 200 220" aria-hidden="true"><use href="#newty"/></svg><p class="say">조각 다섯 개를 등대에 끼웠어! 그런데 등대가 마지막 암호를 묻고 있어. 이번엔 여러 힘을 <b>함께</b> 생각해야 풀 수 있어. 모두 맞히면 등대 불이 켜지고 N호가 다시 출발해. 너는 정식 대원이 되는 거야!</p></div>
  <div class="quiz" id="quiz"></div><div id="certBox"></div></section>`;
  $("#back").onclick=mapView;
  const go=()=>{const qd=S.quiz[5]||{};if(Q[5].every((_,k)=>qd[k]==="ok")){const first=!S.final;if(first){S.final=true;S.coins+=30;save();hud();toast("등대의 암호 해독! +30 N코인")}ending(first)}};
  renderQuiz($("#quiz"),5,go);go();window.scrollTo({top:0});
}

/* ---------- 엔딩 ---------- */
function ending(first){
  const box=$("#certBox");
  const lines=[
   "삐빅! 암호가 맞았어! 다섯 개의 힘의 조각이 등대 꼭대기에서 반짝반짝 빛나기 시작해.",
   "등대의 빛이 바다를 건너 N호에 닿았어. 화살표, 중력, 탄성, 마찰, 부력의 조각이 엔진 속으로 쏙쏙 들어가고 있어!",
   "부르릉… <b>엔진 점화 성공!</b> 3, 2, 1… N호가 다시 하늘로 날아올랐어!",
   "고마워! 네가 아니었으면 난 아직도 힘의 바다에 갇혀 있었을 거야. 출발하기 전에 작은 선물을 준비했어."];
  let k=0;
  box.innerHTML=`<div class="ending" style="margin-top:18px">
    <svg class="scene" id="scene" viewBox="0 0 640 300" role="img" aria-label="등대 불이 켜지고 N호가 하늘로 날아오르는 장면">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2240"/><stop offset="1" stop-color="#3B4C8A"/></linearGradient>
      <radialGradient id="beam" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#FFE38A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient></defs>
      <rect width="640" height="300" fill="url(#sky)"/>
      ${Array.from({length:40},(_,j)=>`<circle cx="${(j*157)%640}" cy="${(j*67)%170}" r="${j%5?1.2:2}" fill="#fff" opacity=".8"/>`).join("")}
      <rect y="240" width="640" height="60" fill="#2C6E9B"/>
      <path class="beam" d="M150 92 L640 20 L640 170 Z" fill="url(#beam)"/>
      <g transform="translate(120 90)"><path d="M10 150 L18 10 H42 L50 150 Z" fill="#fff" stroke="#1F2433" stroke-width="3"/><path d="M14 60 H46 M12 100 H48" stroke="#E8463D" stroke-width="10"/>
        <rect x="14" y="-12" width="32" height="22" rx="4" fill="#1F2433"/><circle class="lamp" cx="30" cy="0" r="8" fill="#555"/>
        ${COL.map((c,j)=>`<circle class="gem" cx="${6+j*12}" cy="-22" r="5" fill="${c}"/>`).join("")}</g>
      <g class="ship" transform="translate(430 205)"><g class="shipin">
        <path class="flame" d="M24 34 q16 34 32 0 q-16 12 -32 0z" fill="#F2B632"/>
        <path d="M0 30 q40 -52 80 0 z" fill="#C9CDD6" stroke="#1F2433" stroke-width="3"/><circle cx="40" cy="12" r="10" fill="#A9D8F2" stroke="#1F2433" stroke-width="3"/>
        <text x="40" y="44" text-anchor="middle" font-family="Jua" font-size="16" fill="#fff">N호</text></g></g>
    </svg>
    <div class="guide" style="margin:14px 0 0"><svg viewBox="0 0 200 220" aria-hidden="true"><use href="#newty"/></svg><p class="say" id="endSay"></p></div>
    <div class="row" id="endBtns" style="justify-content:flex-end;margin-top:12px"></div></div>`;
  const sc=$("#scene");
  const show=()=>{$("#endSay").innerHTML=lines[k];sc.classList.toggle("lit",k>=0);sc.classList.toggle("fuel",k>=1);sc.classList.toggle("fly",k>=2);
    const b=$("#endBtns");
    if(k<lines.length-1){b.innerHTML=`<button class="btn main" id="endNext">${k===1?"엔진 켜기! 🚀":"다음 ▶"}</button>`;$("#endNext").onclick=()=>{k++;show()}}
    else b.innerHTML=`<button class="btn" id="endBonus">⏱ 출발 전에 보너스 스피드전 하기</button><button class="btn main" id="endCert">🎁 선물(대원증) 받기</button>`,
      $("#endBonus").onclick=()=>{toast("보너스를 하고 나서 다시 등대로 오면 선물을 받을 수 있어요!");speedView()},
      $("#endCert").onclick=()=>{b.innerHTML="";cert();$("#certBox .cert").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})};
  };
  if(!first){k=lines.length-1}
  show();
}
function cert(){
  const host=$("#certBox");let box=$("#certInner");if(!box){box=document.createElement("div");box.id="certInner";host.appendChild(box)}const d=new Date();const ds=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  box.innerHTML=`<div class="cert" style="margin-top:18px">
    <svg viewBox="0 0 200 220" style="width:90px;height:auto" aria-hidden="true"><use href="#newty"/></svg>
    <h2>힘의 섬 탐험대 대원증</h2>
    <div class="who" id="certName">${S.name?S.name.replace(/[<>&]/g,""):"이름을 적어 주세요"}</div>
    <p>위 대원은 불시착한 N호를 위해 다섯 섬에서 힘의 조각을 모으고<br>힘의 등대의 암호를 풀어 N호를 다시 날게 하였으므로 <b style="font-weight:400;font-family:var(--title);color:var(--brand)">힘의 섬 탐험대 정식 대원</b>으로 임명합니다.</p>
    <div class="bdg">${ISLES.map((s,i)=>`<span style="background:${COL[i]}">${s.name.replace(" 섬","")}<br>섬</span>`).join("")}</div>
    <p style="font-family:var(--title)">모은 N코인 <span class="coin" style="width:22px;height:22px;font-size:12px">N</span> ${S.coins}</p>
    <p>${ds} · 탐험대장 뉴티</p>
    <div class="namein"><label for="nm" style="align-self:center">이름</label><input id="nm" maxlength="12" value="${S.name.replace(/"/g,"")}" placeholder="예) 1학년 3반 김과학"><button class="btn" id="nmOk">대원증에 쓰기</button></div>
    <p class="hint" style="margin-top:10px">뉴티가 주는 선물이에요! 이름을 쓰고 화면을 캡처해서 선생님께 보여 주세요.</p></div>`;
  $("#nmOk").onclick=()=>{S.name=$("#nm").value.trim().slice(0,12);save();$("#certName").textContent=S.name||"이름을 적어 주세요"};
}

/* ---------- 시작 ---------- */
let tTap=[];
$("#home").onclick=()=>{SP&&clearInterval(SP.timer);const now=Date.now();tTap=tTap.filter(x=>now-x<2500);tTap.push(now);
  if(tTap.length>=5){tTap=[];S.teacher=!S.teacher;save();hud();toast(S.teacher?"선생님 모드: 모든 섬이 열렸어요":"선생님 모드를 껐어요")}
  mapView()};
$("#teacher").onclick=()=>{S.teacher=!S.teacher;save();hud();toast(S.teacher?"선생님 모드: 모든 섬이 열렸어요":"선생님 모드를 껐어요");mapView()};
hud();mapView();
})();
</script>

</body>
</html>
